# 独立生产配置，不与根目录 compose.yaml 叠加。
# 7 个服务（含临时迁移容器）各 100 MiB，应用日志预算 700 MiB < 1 GB。
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "10"

x-backend: &backend
  image: aihot-backend:${AIHOT_RELEASE:?set release SHA}
  build:
    context: ${AIHOT_RELEASE_DIR:?set release directory}/backend
  env_file: ${AIHOT_ROOT:?set deployment root}/shared/backend.env
  environment:
    MYSQL_HOST: tunnel
    MYSQL_PORT: "3306"
    TZ: Asia/Shanghai
    PYTHONUNBUFFERED: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  logging: *logging
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

services:
  tunnel:
    image: aihot-tunnel:${AIHOT_RELEASE:?set release SHA}
    build:
      context: ${AIHOT_RELEASE_DIR:?set release directory}/deploy/tunnel
    env_file: ${AIHOT_ROOT:?set deployment root}/shared/tunnel.env
    volumes:
      - ${AIHOT_ROOT:?set deployment root}/shared/ssh/id_ed25519:/run/ssh/id_ed25519:ro
      - ${AIHOT_ROOT:?set deployment root}/shared/ssh/known_hosts:/run/ssh/known_hosts:ro
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - "/tmp:size=8m,mode=1777"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
    healthcheck:
      test: [CMD, nc, -z, -w, "3", "127.0.0.1", "3306"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  init:
    <<: *backend
    restart: "no"
    profiles: [tools]
    command: [python, -m, app.runtime.migrations]

  api:
    <<: *backend
    depends_on:
      tunnel:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

  worker:
    <<: *backend
    command: [python, -m, app.runtime.github_worker]
    depends_on:
      api:
        condition: service_healthy

  knowledge-worker:
    <<: *backend
    command: [python, -m, app.runtime.knowledge_worker]
    depends_on:
      api:
        condition: service_healthy

  web:
    image: aihot-web:${AIHOT_RELEASE:?set release SHA}
    build:
      context: ${AIHOT_RELEASE_DIR:?set release directory}/frontend
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 6

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-zhangff.cn}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME email}
      SITE_USER: ${SITE_USER:?set login username}
      SITE_PASSWORD_HASH: ${SITE_PASSWORD_HASH:?set bcrypt hash}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ${AIHOT_RELEASE_DIR:?set release directory}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
